name: Quality

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format github

  test:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the Containerfile, and ruff's target-version in pyproject.toml. The annotation
          # syntax pyupgrade produces is evaluated at runtime by FastAPI, so a mismatch here is not
          # a style difference — it is an ImportError at boot.
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: pytest -q
